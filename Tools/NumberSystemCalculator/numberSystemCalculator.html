    <meta name="description" content="Perform basic arithmetic operations (addition, subtraction, multiplication, division) in numeral systems (base 2 to 20) with detailed step-by-step solutions.">
    <title>Number System Calculator – Globomath</title>

<body>
    <header>
        <nav class="navbar">
        <a href="../../index.html"><img src="../../pictures/WebsiteLogoImageLongImageV2.png" alt="" class="navImage"></a>

        <div>
            <input type="text" name="search" id="searchInput" placeholder="Search..." autocomplete="off">

            <div id="searchResults"></div>
        </div>

        <div id="navUserArea"><a href="../../html/login.html" target="_self" class="navTextBorder">Login</a>
            <a href="../../html/register.html" target="_self" class="navTextBorder">Register</a>
        </div>
    </nav>
    </header>
    <main>

        <section class="zahlenBody">
            <h1 class="titleHeader">Number System Calculator</h1>

            <!-- Basis-Auswahl -->
            <div class="basisAuswahlDiv">
                <label for="basea" class="labelBasea">Base:</label>
                <select id="basea" class="selectBasea">
                    <option value="2">2 (Binary)</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                    <option value="9">9</option>
                    <option value="10">10 (Decimal)</option>
                    <option value="11">11</option>
                    <option value="12">12</option>
                    <option value="13">13</option>
                    <option value="14">14</option>
                    <option value="15">15</option>
                    <option value="16">16 (Hexadecimal)</option>
                    <option value="17">17</option>
                    <option value="18">18</option>
                    <option value="19">19</option>
                    <option value="20">20</option>
                </select>
            </div>

            <!-- Rechenausdruck -->
            <div id="systemeContainer">

                <div class="SytemDiv">
                    <input type="text" name="zahl1" id="zahl1Input" placeholder="Number 1" class="zahlenInput">
                </div>

                <div class="rechenZeichenSelectDiv">
                    <select id="rechenZeichenMain" class="rechenZeichenSelect">
                        <option value="+">+</option>
                        <option value="-">−</option>
                        <option value="*">×</option>
                        <option value="/">÷</option>
                    </select>
                </div>

                <div class="SytemDiv">
                    <input type="text" name="zahl2" id="zahl2Input" placeholder="Number 2" class="zahlenInput">
                </div>

            </div>

            <!-- Eingabefelder dynamisch erweitern -->
            <div class="inputSteuerungDiv">
                <button id="btnAddInput" class="buttton" type="button">
                    <i class="fa fa-plus" aria-hidden="true"></i> Add number
                </button>
                <button id="btnDeleteInput" class="buttton" type="button">
                    <i class="fa fa-minus" aria-hidden="true"></i> Remove number
                </button>
            </div>

            <button class="numberButtoncss" id="buttonZahlenInput" type="button">Calculate</button>

            <p class="errorMessagestyle" id="errorMessages">Wrong Input</p>

            <div class="outputStyle" id="ausgabeContainer">
                <div class="loesungsDiv">
                    <p class="loesungText">Result:</p>
                    <p id="loesungOutput"></p>
                </div>
                <div class="rechenwegDiv">
                    <p class="rechenwegText">Calculation steps:</p>
                    <div id="rechenwegOutput"></div>
                </div>
                <span id="tipp"></span>
            </div>
        </section>

    </main>
