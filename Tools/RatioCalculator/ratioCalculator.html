    <main>
        <section class="dreisatzSection">
            <h1 class="titleHeader">Ratio Calculator</h1>

            <div class="dreisatzTypeTabs">
                <button class="dreisatzTypeBtn active" data-type="proportional">Proportional</button>
                <button class="dreisatzTypeBtn" data-type="inverse">Inverse proportional</button>
            </div>

            <p class="instructionText">Leave the field you are looking for blank – it will be calculated automatically.</p>

            <div class="dreisatzLabels">
                <span>Size 1</span>
                <span>Size 2</span>
            </div>
            <div class="dreisatzContainer">
                <div class="row">
                    <input type="number" id="inputFeld1" placeholder="..." class="numberInputField">
                    <input type="number" id="inputFeld2" placeholder="..." class="numberInputField">
                </div>
                <div class="row">
                    <input type="number" id="inputFeld3" placeholder="..." class="numberInputField">
                    <input type="number" id="inputFeld4" placeholder="..." class="numberInputField">
                </div>
            </div>

            <p class="errorMessagestyle" id="errorMessages"></p>

            <div class="outputStyle" id="ausgabeContainer" style="display: none;">
                <div class="rechenwegDiv">
                    <p class="rechenwegText">Calculation steps:</p>
                    <div id="rechenwegOutput"></div>
                </div>
            </div>
        </section>
