    <link rel="stylesheet" href="../../css/v4-shims.min.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Solve general and linear equation systems automatically. Get detailed, step-by-step solutions using substitution, addition, equalization, or Gaussian methods.">
    <title>Equation Solver – Globomath</title>
    <link rel="icon" type="image/png" href="../../favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="../../favicon.svg" />
    <link rel="shortcut icon" href="../../favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="../../apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Globomath" />
    <link rel="manifest" href="../../site.webmanifest" />
    <link rel="stylesheet" href="../../css/feedback.css">
    <link rel="stylesheet" href="../../css/Common/common.css">
    <link rel="stylesheet" href="./equationSolver.css">

    <meta property="og:title" content="Equation Solver – Globomath">
    <meta property="og:description" content="Solve math equations step-by-step online.">
    <meta property="og:image" content="https://www.globomath.com/pictures/og-image.jpg">
    <meta property="og:url" content="https://www.globomath.com/Tools/EquationSolver/equationSolver.html">

    <script type="module">
        import "https://esm.run/mathlive";
    </script>
</head>
<body>
    <header>
        <nav class="navbar">
        <a href="../../index.html"><img src="../../pictures/WebsiteLogoImageLongImageV2.png" alt="" class="navImage"></a>

        <div>
            <input type="text" name="search" id="searchInput" placeholder="Search..." autocomplete="off">

            <div id="searchResults"></div>
        </div>

        <div id="navUserArea"><a href="../../html/login.html" target="_self" class="navTextBorder">Login</a>
            <a href="../../html/register.html" target="_self" class="navTextBorder">Register</a>
        </div>
    </nav>
    </header>
    <main>

        <section class="gleichungSection">
            <h1 class="titleHeader">Equation Solver</h1>

            <div class="gleichungSwitchDiv">
                <button class="gleichungTypeBtn active" data-type="allgemein">General equations</button>
                <button class="gleichungTypeBtn" data-type="linear">Linear equations</button>
            </div>

            <div class="gleichungsContainer" id="allgemeineGleichungsContainer">

                <math-field id="mathInputAllgemein" class="numberInputField" placeholder="$$2+4=c $$"></math-field>

                <div class="zielVariableDiv">
                    <!-- KORREKTUR: "Redeem for" zu "Rearrange for" geändert -->
                    <h2 class="zielVariableLabel">Rearrange for</h2>

                    <select name="selectVariable" id="selectVariableAllgemein" class="selection">
                        <option value=""> ...</option>
                    </select>
                </div>
            </div>

            <div class="gleichungsContainer" id="lineareGleichungsContainer">
                <div class="inputsContainer">
                    <div class="inputRow"><span class="rowNumber">1&#41;</span><math-field class="numberInputField lgsGleichungInput" placeholder="$$a+7b=6 $$"></math-field></div>
                    <div class="inputRow"><span class="rowNumber">2&#41;</span><math-field class="numberInputField lgsGleichungInput" placeholder="$$a+7b=6 $$"></math-field></div>
                </div>

                    <!-- Eingabefelder dynamisch erweitern -->
                <div class="inputSteuerungDiv">
                    <button id="btnAddInput" class="buttton" type="button">
                        <i class="fa fa-plus" aria-hidden="true"></i> Add field
                    </button>
                    <button id="btnDeleteInput" class="buttton" type="button">
                        <i class="fa fa-minus" aria-hidden="true"></i> Remove field
                    </button>
                </div>

                <div class="lösungsVerfahrenDiv">
                    <div class="lösungsVerfahrenExpendDiv">
                        <h2 class="lösungsVerfahrenLabel">Solution methods</h2>
                        <button class="expandBtn" aria-label="Expand">
                            <i class="fa fa-chevron-down"></i>
                        </button>
                    </div>
                    <select name="selectProcedure" id="selectProcedure" class="selection">
                        <option value="automatic">Automatic</option>
                        <option value="substitution">Substitution method</option>
                        <option value="addition">Addition method</option>
                        <option value="equalization">Equalization method</option>
                        <option value="gaussian">Gaussian method</option>
                    </select>
                </div>

                <div class="zielVariableDiv">
                    <!-- KORREKTUR: "Redeem for" zu "Rearrange for" geändert -->
                    <h2 class="zielVariableLabel">Rearrange for</h2>

                    <select name="selectVariable" id="selectVariableLinear" class="selection">
                        <option value="all">All</option>
                        <option value="">...</option>
                    </select>
                </div>
            </div>


            <button class="numberButtoncss" id="buttonZahlenInput" type="button">Solve</button>

            <p class="errorMessagestyle" id="errorMessages">Wrong input</p>

            <div class="outputStyle">
                <div class="loesungsDiv"> <p class="loesungText">Result:</p><p id="loesungOutput"></p></div>
                <div class="rechenwegDiv">
                    <p class="rechenwegText">Calculation steps:</p> <div id="rechenwegOutput"></div>
                </div>
                <span id="tipp"></span>
            </div>
        </section>
    </main>
    <footer>
        <div class="footerNav">
            <div class="footerSocial">
                <a href="https://www.tiktok.com/@globomath?_r=1&_t=ZN-98pHu3qNgeM" target="_blank" rel="noopener noreferrer" aria-label="TikTok"><i class="fab fa-tiktok"></i></a>
                <a href="https://www.instagram.com/globomath?igsh=NmZzNW5mcjE3bWs5" target="_blank" rel="noopener noreferrer"><i class="fa fa-instagram"></i></a>
                <a href="https://www.youtube.com/@Globomath" target="_blank" rel="noopener noreferrer"><i class="fa fa-youtube-play"></i></a>
            </div>

            <div class="leftFootersect">
                <a href="../../html/Privacypolicy.html">Privacy policy</a>
                <button id="openFeedbackBtn">Feedback</button>
                <a href="../../html/Imprint.html">Imprint</a>
            </div>
            
            <div class="placeholderFooter">&copy;2026 Globomath</div>
        </div>
    </footer>
    <script src="../../javaScript/Common/common-login.js"></script>
    <script src="./equationSolver.js"></script>
    <script src="../../javaScript/feedback.js"></script>
    <script type="module" src="../../javaScript/toolFavorite.js"></script>
    <script type="module" src="../../javaScript/search.js"></script>
</body>
</html>
