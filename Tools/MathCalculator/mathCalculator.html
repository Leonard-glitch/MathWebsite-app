<!DOCTYPE html>
<html lang="en">
<head>
    <script src="../../javaScript/Common/theme-init.js"></script>
    <link rel="stylesheet" href="../../css/all.min.css">
    <link rel="stylesheet" href="../../css/v4-shims.min.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Scientific math calculator featuring trigonometry (sin, cos, tan), roots, standard arithmetic operations, and history for complex math problems.">
    <title>Math Calculator – Globomath</title>
    <link rel="icon" type="image/png" href="../../favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="../../favicon.svg" />
    <link rel="shortcut icon" href="../../favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="../../apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Globomath" />
    <link rel="manifest" href="../../site.webmanifest" />
    <link rel="stylesheet" href="../../css/feedback.css">
    <link rel="stylesheet" href="../../css/Common/common.css">
    <link rel="stylesheet" href="./mathCalculator.css">

    <meta property="og:title" content="Math Calculator – Globomath">
    <meta property="og:description" content="Versatile online calculator for math calculations.">
    <meta property="og:image" content="https://www.globomath.com/pictures/og-image.jpg">
    <meta property="og:url" content="https://www.globomath.com/Tools/MathCalculator/mathCalculator.html">

    <script type="module">
        import "https://esm.run/mathlive";
    </script>
</head>
<body>
    <header>
        <nav class="navbar">
            <a href="../../index.html"><img src="../../pictures/WebsiteLogoImageLongImageV2.png" alt="" class="navImage"></a>

            <div>
                <input type="text" name="search" id="searchInput" placeholder="Search..." autocomplete="off">

                <div id="searchResults"></div>
            </div>

            <div id="navUserArea"><a href="../../html/login.html" target="_self" class="navTextBorder">Login</a>
                <a href="../../html/register.html" target="_self" class="navTextBorder">Register</a>
            </div>
        </nav>
    </header>
    <main>
        <section class="mathCalculatorSection">
            <h1 class="titleHeader">Math Calculator</h1>

            <div class="mathMainCard">
                <div class="mathMainCardTop">
                    <div class="advancedMode">
                        <span class="advancedText">Advanced Mode</span>
                        <label class="switch"><input type="checkbox"><span class="slider round"></span></label>
                    </div>
                    <div class="liveanddegSettings">
                        <div class="liveresultbutton">
                            <span class="advancedText">Live result</span>
                            <!-- Rounded switch -->
                            <label class="switch"><input type="checkbox"><span class="slider round"></span></label>
                        </div>

                        <div>
                            <select name="degrad" id="degradSwitch" class="selection">
                            <option value="deg">DEG</option>
                            <option value="rad">RAD</option>
                        </select>
                        </div>
                    </div>
                </div>
                <div class="mathMainCardMainContainer">
                    <math-field id="mathInput" class="numberInputField" placeholder="$$5+7$$"></math-field>

                    <p class="errorMessagestyle" id="errorMessages"></p>

                    <div class="resultAndpathDiv">
                        <div class="resultDiv"><span class="resultLable">Result:</span><span id="resultoutput"></span></div>
                        <div class="pathDiv">
                            <div class="pathLable"><button class="button" id="pathDropoutBtn"><span class="arrowButtonSpan"><i class="fa fa-chevron-down detailsChevron" aria-hidden="true"></i></span>Calculation steps<span class="arrowButtonSpan"><i class="fa fa-chevron-down detailsChevron" aria-hidden="true"></i></span></button></div>
                            <div id="pathOutput"></div>
                        </div>
                    </div>

                    <div class="customInputsSec">
                        <div class="customInputContainer" id="quickAccessContainer">
                            <div class="customInputContainerRow">
                                <button class="padButton" id="btn-std-sq">x²</button>
                                <button class="padButton" id="btn-std-sqrt">√</button>
                                <button class="padButton" id="btn-std-sin">sin</button>
                                <button class="padButton" id="btn-std-cos">cos</button>
                            </div>
                            
                            <div class="customInputContainerRow">
                                <button class="padButton" id="btn-std-tan">tan</button>
                                <button class="padButton" id="btn-std-pi">π</button>
                                <button class="padButton" id="btn-std-percent">%</button>
                                <div style="flex: 1;"></div>
                            </div>
                        </div>
                        <div class="customInputContainer" id="numericKeypadContainer">
                            <div class="customInputContainerRow">
                                <button class="padButton" id="btn-open" data-insert="(">(</button>
                                <button class="padButton" id="btn-close" data-insert=")">)</button>
                                <button class="padButton" id="btn-clear" data-action="clear">C</button>
                                <button class="padButton" id="btn-del" data-action="delete">⌫</button>
                            </div>
                            
                            <div class="customInputContainerRow">
                                <button class="padButton" id="btn-7" data-insert="7">7</button>
                                <button class="padButton" id="btn-8" data-insert="8">8</button>
                                <button class="padButton" id="btn-9" data-insert="9">9</button>
                                <button class="padButton" id="btn-div" data-insert="\div">÷</button>
                            </div>
                            
                            <div class="customInputContainerRow">
                                <button class="padButton" id="btn-4" data-insert="4">4</button>
                                <button class="padButton" id="btn-5" data-insert="5">5</button>
                                <button class="padButton" id="btn-6" data-insert="6">6</button>
                                <button class="padButton" id="btn-mul" data-insert="\times">×</button>
                            </div>
                            
                            <div class="customInputContainerRow">
                                <button class="padButton" id="btn-1" data-insert="1">1</button>
                                <button class="padButton" id="btn-2" data-insert="2">2</button>
                                <button class="padButton" id="btn-3" data-insert="3">3</button>
                                <button class="padButton" id="btn-sub" data-insert="-">−</button>
                            </div>
                            
                            <div class="customInputContainerRow">
                                <button class="padButton" id="btn-0" data-insert="0">0</button>
                                <button class="padButton" id="btn-dot" data-insert=".">.</button>
                                <button class="padButton" id="btn-add" data-insert="+">+</button>
                                <button class="padButton" id="btn-eq" data-action="equals">=</button>
                            </div>
                        </div>
                    </div>

                    <div class="historyDiv">
                        <div class="historyLable"><button class="button" id="showHistoryBtn"><span class="arrowButtonSpan"><i class="fa fa-chevron-down detailsChevron" aria-hidden="true"></i></span>History<span class="arrowButtonSpan"><i class="fa fa-chevron-down detailsChevron" aria-hidden="true"></i></span></button></div>
                        <div id="historyOutput"></div>
                        <div class="deleteHistory"><button class="button" id="deleteHistoryBtn">Delete history</button></div>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <footer>
        <div class="footerNav">
            <div class="footerSocial">
                <a href="https://www.tiktok.com/@globomath?_r=1&_t=ZN-98pHu3qNgeM" target="_blank" rel="noopener noreferrer" aria-label="TikTok"><i class="fab fa-tiktok"></i></a>
                <a href="https://www.instagram.com/globomath?igsh=NmZzNW5mcjE3bWs5" target="_blank" rel="noopener noreferrer"><i class="fa fa-instagram"></i></a>
                <a href="https://www.youtube.com/@Globomath" target="_blank" rel="noopener noreferrer"><i class="fa fa-youtube-play"></i></a>
            </div>

            <div class="leftFootersect">
                <a href="../../html/Privacypolicy.html">Privacy policy</a>
                <button id="openFeedbackBtn">Feedback</button>
                <a href="../../html/Imprint.html">Imprint</a>
            </div>
            
            <div class="placeholderFooter">&copy;2026 Globomath</div>
        </div>
    </footer>
    <script src="../../javaScript/Common/common-login.js"></script>
    <script src="./mathCalculator.js"></script>
    <script src="../../javaScript/feedback.js"></script>
    <script type="module" src="../../javaScript/toolFavorite.js"></script>
    <script type="module" src="../../javaScript/search.js"></script>
</body>
</html>
