    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decimal ↔ Fraction Converter</title>
    <link rel="icon" type="image/png" href="../../favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="../../favicon.svg" />
    <link rel="shortcut icon" href="../../favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="../../apple-touch-icon.png" />

</head>
<body>
    <header>
        <nav class="navbar">
        <a href="../../index.html"><img src="../../pictures/WebsiteLogoImageLongImageV2.png" alt="" class="navImage"></a>

        <div>
            <input type="text" name="search" id="searchInput" placeholder="Search..." autocomplete="off">

            <div id="searchResults"></div>
        </div>

        <div id="navUserArea"><a href="../../html/login.html" target="_self" class="navTextBorder">Login</a>
            <a href="../../html/register.html" target="_self" class="navTextBorder">Register</a>
        </div>
    </nav>
    </header>
    <main>

        <section class="dezBruchSection">
            <h1 class="titleHeader">Decimal ↔ Fraction Converter</h1>

            <div class="cardsContainer">
                <div class="cards">
                    <h3>Input</h3>
                    <div id="cardDezimalContainer">
                        <div class="card">
                            <h2>Decimal</h2>

                            <input type="number" id="inputFeld3" placeholder="0.75" class="numberInputField">
                        </div>
                    </div>
                </div>

                <button class="swapBtn" id="swapBtn" type="button" aria-label="Eingabe und Ausgabe tauschen">
                    <i class="fa fa-exchange"></i>
                </button>

                <div class="cards">
                    <h3>Output</h3>
                    <div id="cardBruchContainer">
                        <div class="card">
                            <h2>Fraction </h2>

                            <div class="bruchEingabe">
                                <input type="number" id="zaehler1" placeholder="Numerator " class="numberInputField" step="1">
                                <div class="bruchStrich"></div>
                                <input type="number" id="nenner1"  placeholder="Denominator" class="numberInputField" step="1">
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <p class="errorMessagestyle" id="errorMessages"></p>

            <div class="outputStyle" id="ausgabeContainer">
                <div class="rechenwegDiv">
                    <p class="rechenwegText">Calculation steps:</p>
                    <div id="rechenwegOutput"></div>
                </div>
            </div>
        </section>

    </main>
    <footer>
        <div class="footerNav">
            <div class="footerSocial">
                <a href="https://www.tiktok.com/@globomath?_r=1&_t=ZN-98pHu3qNgeM" target="_blank" rel="noopener noreferrer" aria-label="TikTok"><i class="fab fa-tiktok"></i></a>
                <a href="https://www.instagram.com/globomath?igsh=NmZzNW5mcjE3bWs5" target="_blank" rel="noopener noreferrer"><i class="fa fa-instagram"></i></a>
                <a href="https://www.youtube.com/@Globomath" target="_blank" rel="noopener noreferrer"><i class="fa fa-youtube-play"></i></a>
            </div>

            <div class="leftFootersect">
                <a href="../../html/Privacypolicy.html">Privacy policy</a>
                <button id="openFeedbackBtn">Feedback</button>
                <a href="../../html/Imprint.html">Imprint</a>
            </div>
            
            <div class="placeholderFooter">&copy;2026 Globomath</div>
        </div>

    <script type="module" src="../../javaScript/search.js"></script>
</body>
