<!DOCTYPE html>
<html lang="en">
<head>
    <script src="../../javaScript/Common/theme-init.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Easily add, subtract, multiply, and divide fractions. Supports simplifying, expanding, and calculating with mixed numbers, complete with step-by-step solutions.">
    <link rel="stylesheet" href="../../css/all.min.css">
    <link rel="stylesheet" href="../../css/v4-shims.min.css">
    <link rel="icon" type="image/png" href="../../favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="../../favicon.svg" />
    <link rel="shortcut icon" href="../../favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="../../apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Globomath" />
    <link rel="manifest" href="../../site.webmanifest" />
    <link rel="stylesheet" href="../../css/feedback.css">
    <link rel="stylesheet" href="../../css/Common/common.css">
    <link rel="stylesheet" href="./fractionCalculator.css">
    <title>Fraction Calculator</title>
</head>
<body>
    <header>
        <nav class="navbar">
            <a href="../../index.html"><img src="../../pictures/WebsiteLogoImageLongImageV2.png" alt="" class="navImage"></a>

            <div>
                <input type="text" name="search" id="searchInput" placeholder="Search..." autocomplete="off">
                <div id="searchResults"></div>
            </div>

            <div id="navUserArea">
                <a href="../../html/login.html" target="_self" class="navTextBorder">Login</a>
                <a href="../../html/register.html" target="_self" class="navTextBorder">Register</a>
            </div>
        </nav>
    </header>

    <main>
        <section class="bruchrechnerBody">
            <h1 class="titleHeader">Fraction Calculator</h1>

            <!-- Operation Tabs -->
            <div class="einheitenGruppenContainer">
                <button data-operation="add"       class="btnUnits active">Add</button>
                <button data-operation="sub"       class="btnUnits">Subtract</button>
                <button data-operation="mul"       class="btnUnits">Multiply</button>
                <button data-operation="div"       class="btnUnits">Divide</button>
                <button data-operation="kuerzen"   class="btnUnits">Simplify</button>
                <button data-operation="erweitern" class="btnUnits">Expand</button>
            </div>

            <!-- Mixed Numbers Toggle -->
            <div class="advancedMode">
                <span class="advancedText">Mixed numbers</span>
                <label class="switch">
                    <input type="checkbox" id="mixedToggle">
                    <span class="slider round"></span>
                </label>
            </div>

            <!-- Calculator Row -->
            <div class="bruchRechnerContainer">

                <!-- Bruch 1 -->
                <div class="bruchWrapper" id="wrapperBruch1">
                    <input type="number" id="ganzzahl1" placeholder="0" class="numberInputField mixed-field" step="any">
                    <div class="bruchEingabe">
                        <input type="number" id="zaehler1" placeholder="Numerator" class="numberInputField" step="any">
                        <div class="bruchStrich"></div>
                        <input type="number" id="nenner1"  placeholder="Denominator" class="numberInputField" step="any">
                    </div>
                </div>

                <!-- Operator Symbol -->
                <div id="operationZeichen" class="opSymbol">+</div>

                <!-- Bruch 2 / Erweiterungsfaktor -->
                <div class="bruchWrapper" id="wrapperBruch2">
                    <input type="number" id="ganzzahl2" placeholder="0"      class="numberInputField mixed-field" step="any">
                    <input type="number" id="erwFaktor" placeholder="Factor" class="numberInputField single-factor-field" step="any">
                    <div class="bruchEingabe" id="bruch2Eingabe">
                        <input type="number" id="zaehler2"  placeholder="Numerator" class="numberInputField" step="any">
                        <div class="bruchStrich"></div>
                        <input type="number" id="nenner2"   placeholder="Denominator" class="numberInputField" step="any">
                    </div>
                </div>

                <!-- Equals + Result -->
                <div class="opSymbol">=</div>
                <div class="loesungsDiv">
                    <p id="loesungOutput">Result</p>
                </div>

            </div>

            <!-- Error Message -->
            <p id="errorMessages" class="errorMessagestyle"></p>

            <!-- Step-by-Step Rechenweg -->
            <div class="outputStyle" id="ausgabeContainer">
                <div class="rechenwegDiv">
                    <p class="rechenwegText">Calculation steps:</p>
                    <div id="rechenwegOutput"></div>
                </div>
            </div>

        </section>
    </main>

    <footer>
        <div class="footerNav">
            <div class="footerSocial">
                <a href="https://www.tiktok.com/@globomath?_r=1&_t=ZN-98pHu3qNgeM" target="_blank" rel="noopener noreferrer" aria-label="TikTok"><i class="fab fa-tiktok"></i></a>
                <a href="https://www.instagram.com/globomath?igsh=NmZzNW5mcjE3bWs5" target="_blank" rel="noopener noreferrer"><i class="fa fa-instagram"></i></a>
                <a href="https://www.youtube.com/@Globomath" target="_blank" rel="noopener noreferrer"><i class="fa fa-youtube-play"></i></a>
            </div>

            <div class="leftFootersect">
                <a href="../../html/Privacypolicy.html">Privacy policy</a>
                <button id="openFeedbackBtn">Feedback</button>
                <a href="../../html/Imprint.html">Imprint</a>
            </div>
            
            <div class="placeholderFooter">&copy;2026 Globomath</div>
        </div>
    </footer>

    <script src="../../javaScript/Common/common-login.js"></script>
    <script src="./fractionCalculator.js"></script>
    <script src="../../javaScript/feedback.js"></script>
    <script type="module" src="../../javaScript/toolFavorite.js"></script>
    <script type="module" src="../../javaScript/search.js"></script>
</body>
</html>
