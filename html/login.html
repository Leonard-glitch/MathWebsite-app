<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/all.min.css">
    <link rel="stylesheet" href="../css/v4-shims.min.css">
    <link rel="icon" type="image/png" href="../favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <link rel="shortcut icon" href="../favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Globomath" />
    <link rel="manifest" href="../site.webmanifest" />
    <link rel="stylesheet" href="../css/feedback.css">
    <link rel="stylesheet" href="../css/Common/common.css">
    <link rel="stylesheet" href="../css/login.css">
    <title>Login Globomath</title>
</head>
<body>
    <header>
        <nav class="navbar">
            <a href="../index.html">
                <img src="../pictures/WebsiteLogoImageLongImageV2.png" alt="MathVerse" class="navImage">
            </a>
            <div class="searchContainer">
                <input type="text" name="search" id="searchInput" placeholder="Search..." autocomplete="off">
                <div id="searchResults"></div>
            </div>
            <div id="navUserArea">
                <a href="./login.html" class="navTextBorder">Login</a>
                <a href="./register.html" class="navTextBorder">Register</a>
            </div>
        </nav>
    </header>

    <main>
        <section>
            <div class="loginContainer">
                <h1 class="loginTitle">Login</h1>

                <form action="/login" method="POST" class="loginForm" novalidate>

                    <div class="inputGroup">
                        <input type="text" id="username" name="username"
                            class="xInput" placeholder=" "
                            required autocomplete="username"
                            inputmode="email" 
                            autocapitalize="none" 
                            autocorrect="off" 
                            spellcheck="false">
                        <label for="username" class="floatingLabel">Username or email</label>
                        <small class="input-hint">You can log in with your username or email.</small>
                    </div>
                    <div id="usernameError" class="errorMessagestyle field-error" style="display:none;"></div>

                    <div class="inputGroup">
                        <input type="password" id="password" name="password"
                               class="xInput" placeholder=" "
                               required autocomplete="current-password">
                        <label for="password" class="floatingLabel">Password</label>
                        <button type="button" class="passwordToggle" id="togglePassword"
                                tabindex="-1" aria-label="Show password">
                            <i class="fa fa-eye"></i>
                        </button>
                        <div class="forgotPasswordWrapper">
                            <a href="./forgot-password.html" class="forgotPasswordLink">Forgot password?</a>
                        </div>
                    </div>
                    <div id="formError" class="errorMessagestyle field-error" style="display:none;"></div>

                    <button type="submit" class="xLoginBtn">Log in</button>
                </form>

                <div class="signupPrompt">
                    Don't have an account yet? <a href="./register.html" class="signupLink">Register</a>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="footerNav">
            <div class="footerSocial">
                <a href="https://www.tiktok.com/@globomath?_r=1&_t=ZN-98pHu3qNgeM" target="_blank" rel="noopener noreferrer" aria-label="TikTok"><i class="fab fa-tiktok"></i></a>
                <a href="https://www.instagram.com/globomath?igsh=NmZzNW5mcjE3bWs5" target="_blank" rel="noopener noreferrer"><i class="fa fa-instagram"></i></a>
                <a href="https://www.youtube.com/@Globomath" target="_blank" rel="noopener noreferrer"><i class="fa fa-youtube-play"></i></a>
            </div>

            <div class="leftFootersect">
                <a href="../html/Privacypolicy.html">Privacy policy</a>
                <button id="openFeedbackBtn">Feedback</button>
                <a href="../html/Imprint.html">Imprint</a>
            </div>
            
            <div class="placeholderFooter">&copy;2026 Globomath</div>
        </div>
    </footer>

    <script src="../javaScript/Common/common-login.js"></script>
    <script src="../javaScript/login.js"></script>
    <script src="../javaScript/feedback.js"></script>
    <script type="module" src="../javaScript/search.js"></script>
</body>
</html>
