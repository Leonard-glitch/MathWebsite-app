<!DOCTYPE html>
<html lang="en">
<head>
    <script src="../javaScript/Common/theme-init.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create a free Globomath account today. Save your calculation history, bookmark your favorite tools, and unlock advanced features.">
    <link rel="stylesheet" href="../css/all.min.css">
    <link rel="stylesheet" href="../css/v4-shims.min.css">
    <link rel="icon" type="image/png" href="../favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <link rel="shortcut icon" href="../favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Globomath" />
    <link rel="manifest" href="../site.webmanifest" />
    <link rel="stylesheet" href="../css/feedback.css">
    <link rel="stylesheet" href="../css/Common/common.css">
    <link rel="stylesheet" href="../css/register.css">

    <meta property="og:title" content="Register – Globomath">
    <meta property="og:description" content="Create a free Globomath account.">
    <meta property="og:image" content="https://www.globomath.com/pictures/og-image.jpg">
    <meta property="og:url" content="https://www.globomath.com/html/register.html">
    <title>Register – Globomath</title>
</head>
<body>
    <header>
        <nav class="navbar">
            <a href="../index.html">
                <img src="../pictures/WebsiteLogoImageLongImageV2.png" alt="Globomath" class="navImage">
            </a>
            <div class="searchContainer">
                <input type="text" name="search" id="searchInput" placeholder="Search..." autocomplete="off">
                <div id="searchResults"></div>
            </div>
            <div id="navUserArea"><a href="./login.html" class="navTextBorder">Login</a>
                <a href="./register.html" class="navTextBorder">Register</a>
            </div>
        </nav>
    </header>

    <main>
        <section>
            <div class="loginContainer">
                <h1 class="loginTitle">Register</h1>

                <form action="/register" method="POST" class="loginForm" novalidate>

                    <div class="inputGroup">
                        <input type="text" id="userName" name="userName"
                               class="xInput" placeholder=" "
                               required autocomplete="username">
                        <label for="userName" class="floatingLabel">Username</label>
                    </div>
                    <div id="usernameError" class="errorMessagestyle field-error" style="display:none;"></div>

                    <div class="inputGroup">
                        <input type="email" id="email" name="email"
                               class="xInput" placeholder=" "
                               required autocomplete="email">
                        <label for="email" class="floatingLabel">Email address</label>
                    </div>
                    <div id="emailError" class="errorMessagestyle field-error" style="display:none;"></div>

                    <div class="inputGroup">
                        <input type="password" id="password" name="password"
                               class="xInput" placeholder=" "
                               required autocomplete="new-password">
                        <label for="password" class="floatingLabel">Password</label>
                        <button type="button" class="passwordToggle" id="togglePassword"
                                tabindex="-1" aria-label="Show password">
                            <i class="fa fa-eye"></i>
                        </button>
                    </div>

                    <div class="inputGroup">
                        <input type="password" id="passwordConf" name="passwordConf"
                               class="xInput" placeholder=" "
                               required autocomplete="new-password">
                        <label for="passwordConf" class="floatingLabel">Confirm password</label>
                        <button type="button" class="passwordToggle" id="togglePasswordConf"
                                tabindex="-1" aria-label="Show confirmation password">
                            <i class="fa fa-eye"></i>
                        </button>
                    </div>
                    <div id="formError" class="errorMessagestyle field-error" style="display:none;"></div>

                    <div class="checkboxGroup">
                        <input type="checkbox" id="privacyAccept" name="privacyAccept" required>
                        <!-- FIX: <span> durch <label for="..."> ersetzt -->
                        <label for="privacyAccept" class="checkboxText">
                            I confirm that I am 14 years of age or older (or have obtained parental consent) and I accept the 
                            <a href="./Privacypolicy.html" target="_blank" rel="noopener noreferrer">Privacy policy</a>
                            <span class="accent-error">*</span>
                        </label>
                    </div>

                    <div class="strengthWrapper" id="strengthWrapper" style="display:none;">
                        <div class="strengthBar">
                            <div class="strengthFill" id="strengthFill"></div>
                        </div>
                        <span class="strengthLabel" id="strengthLabel"></span>
                    </div>

                    <button type="submit" class="xLoginBtn">Register</button>
                </form>

                <div class="signupPrompt">
                    Already have an account? <a href="./login.html" class="signupLink">Log in</a>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="footerNav">
            <div class="footerSocial">
                <a href="https://www.tiktok.com/@globomath?_r=1&_t=ZN-98pHu3qNgeM" target="_blank" rel="noopener noreferrer" aria-label="TikTok"><i class="fab fa-tiktok"></i></a>
                <a href="https://www.instagram.com/globomath?igsh=NmZzNW5mcjE3bWs5" target="_blank" rel="noopener noreferrer"><i class="fa fa-instagram"></i></a>
                <a href="https://www.youtube.com/@Globomath" target="_blank" rel="noopener noreferrer"><i class="fa fa-youtube-play"></i></a>
            </div>

            <div class="leftFootersect">
                <a href="../html/Privacypolicy.html">Privacy policy</a>
                <button id="openFeedbackBtn">Feedback</button>
                <a href="../html/Imprint.html">Imprint</a>
            </div>
            
            <div class="placeholderFooter">&copy;2026 Globomath</div>
        </div>
    </footer>

    <script src="../javaScript/Common/common-login.js"></script>
    <script src="../javaScript/register.js"></script>
    <script src="../javaScript/feedback.js"></script>
    <script type="module" src="../javaScript/search.js"></script>
</body>
</html>
