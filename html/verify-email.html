<!DOCTYPE html>
<html lang="en">
<head>
    <script src="../javaScript/Common/theme-init.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Confirm your Globomath account. We've sent a verification link to your email address.">
    <link rel="stylesheet" href="../css/all.min.css">
    <link rel="stylesheet" href="../css/v4-shims.min.css">
    <meta name="robots" content="noindex, follow">
    <link rel="icon" type="image/png" href="../favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <link rel="shortcut icon" href="../favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Globomath" />
    <link rel="manifest" href="../site.webmanifest" />
    <link rel="stylesheet" href="../css/feedback.css">
    <link rel="stylesheet" href="../css/Common/common.css">
    <link rel="stylesheet" href="../css/login.css">
    <title>Verify your email – Globomath</title>
</head>
<body>
    <header>
        <nav class="navbar">
            <a href="../index.html"><img src="../pictures/WebsiteLogoImageLongImageV2.png" alt="Globomath" class="navImage"></a>
            <div class="searchContainer">
                <input type="text" name="search" id="searchInput" placeholder="Search..." autocomplete="off">
                <div id="searchResults"></div>
            </div>
            <div id="navUserArea">
                <a href="./login.html" class="navTextBorder">Login</a>
                <a href="./register.html" class="navTextBorder">Register</a>
            </div>
        </nav>
    </header>

    <main>
        <section>
            <div class="loginContainer">
                <h1 class="loginTitle">Verification email sent</h1>

                <p class="successMessagestyle">
                    <i class="fa fa-check-circle"></i>
                    <span>We've sent a confirmation link to <strong id="pendingEmailLabel">your email address</strong>. Please check your inbox (and spam folder) and click the link to activate your account.</span>
                </p>

                <div id="verifyFormError" class="errorMessagestyle field-error" style="display:none;"></div>

                <button type="button" class="xLoginBtn" id="resendBtn">Resend email</button>
                <button type="button" class="xLoginBtn xLoginBtn--secondary" id="changeEmailBtn">Change email address</button>

                <div class="signupPrompt">
                    <a href="./login.html" class="signupLink">Back to login</a>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="footerNav">
            <div class="footerSocial">
                <a href="https://www.tiktok.com/@globomath?_r=1&_t=ZN-98pHu3qNgeM" target="_blank" rel="noopener noreferrer" aria-label="TikTok"><i class="fab fa-tiktok"></i></a>
                <a href="https://www.instagram.com/globomath?igsh=NmZzNW5mcjE3bWs5" target="_blank" rel="noopener noreferrer"><i class="fa fa-instagram"></i></a>
                <a href="https://www.youtube.com/@Globomath" target="_blank" rel="noopener noreferrer"><i class="fa fa-youtube-play"></i></a>
            </div>
            <div class="leftFootersect">
                <a href="../html/Privacypolicy.html">Privacy policy</a>
                <button id="openFeedbackBtn">Feedback</button>
                <a href="../html/Imprint.html">Imprint</a>
            </div>
            <div class="placeholderFooter">&copy;2026 Globomath</div>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="../javaScript/Common/common-login.js"></script>
    <script src="../javaScript/verify-email.js"></script>
    <script src="../javaScript/feedback.js"></script>
    <script type="module" src="../javaScript/search.js"></script>
</body>
</html>
